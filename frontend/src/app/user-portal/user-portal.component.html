<div class="portal">
  <header class="portal-header">
    <h1>User portal</h1>
    <button type="button" class="logout-btn" (click)="logout()">Log out</button>
  </header>
  <p class="intro">
    Welcome. This area is for the Keycloak role <strong>client_user</strong>
    (<strong>client_admin</strong> accounts are redirected to the dashboard).
  </p>
  <p class="hint" *ngIf="!isClientUser">
    Warning: no <strong>client_user</strong> role was found on your token — check the <strong>frontend</strong> client configuration in Keycloak.
  </p>
</div>
