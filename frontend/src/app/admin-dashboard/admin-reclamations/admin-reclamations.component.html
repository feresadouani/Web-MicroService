<div class="dashboard-layout">
  <app-sidebar [title]="'Dashboard Admin'" [items]="menuItems"></app-sidebar>

  <section class="dashboard-content">
    <app-navbar></app-navbar>

    <section class="header-row">
      <h1>Reclamations</h1>
      <div class="header-actions">
        <button type="button" class="ghost-btn" (click)="refresh()">Refresh</button>
      </div>
    </section>

    <article class="card">
      <p class="error" *ngIf="error">{{ error }}</p>
      <p *ngIf="loading">Loading...</p>

      <table *ngIf="!loading">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Created</th>
            <th style="width: 120px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="!error && rows.length === 0">
            <td colspan="4" class="empty">No reclamations yet.</td>
          </tr>
          <tr *ngFor="let r of rows">
            <td>
              <strong>{{ r.title }}</strong>
              <div class="desc">{{ r.description }}</div>
            </td>
            <td>
              <span class="status" [attr.data-status]="r.status">{{ r.status }}</span>
            </td>
            <td>{{ r.createdAt ? (r.createdAt | date:'medium') : '—' }}</td>
            <td><a class="link" [routerLink]="['/admin', 'reclamations', r.id]">Consulter</a></td>
          </tr>
        </tbody>
      </table>
    </article>

    <app-footer [text]="'© 2026 Reclamations Administration'"></app-footer>
  </section>
</div>
