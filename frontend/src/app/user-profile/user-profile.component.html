<div class="transit-page">
  <app-user-navbar [active]="'profile'"></app-user-navbar>

  <section class="hero">
    <div class="hero-content">
      <h1>Update Your Profile</h1>
      <p>Keep your account information up to date across your local account and Keycloak.</p>
    </div>
  </section>

  <section class="section section-profile">
    <div class="section-header">
      <h2>Profile Information</h2>
      <p>Edit your personal details and password</p>
    </div>

    <div class="state-container" *ngIf="loading">
      <div class="spinner"></div>
      <p class="state-text">Loading profile...</p>
    </div>
    <div class="state-container error" *ngIf="error">
      <span class="state-icon">❌</span>
      <p class="state-text">{{ error }}</p>
    </div>
    <div class="state-container success" *ngIf="success">
      <span class="state-icon">✅</span>
      <p class="state-text">{{ success }}</p>
    </div>

    <form *ngIf="!loading" class="profile-form" (ngSubmit)="save()">
      <label>
        First name
        <input type="text" [(ngModel)]="form.firstname" name="firstname" required />
      </label>

      <label>
        Last name
        <input type="text" [(ngModel)]="form.lastname" name="lastname" required />
      </label>

      <label>
        Email
        <input type="email" [(ngModel)]="form.email" name="email" disabled />
      </label>

      <label>
        Birthday
        <input type="date" [(ngModel)]="form.birthday" name="birthday" />
      </label>

      <label>
        New password
        <input
          type="password"
          [(ngModel)]="form.password"
          name="password"
          placeholder="Leave empty to keep current password"
          (ngModelChange)="onPasswordChange()" />
      </label>
      <p class="field-error" *ngIf="passwordError">{{ passwordError }}</p>

      <button type="submit" class="submit-btn" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  </section>
</div>
