spring.application.name=clubs-service
server.port=8085

# JWT Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/spring

# MySQL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true

# Spring Data REST
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

keycloak.admin.enabled=true
keycloak.admin.server-url=http://localhost:8080
# Jeton : realm du endpoint (souvent master)
keycloak.admin.admin-realm=master
keycloak.admin.grant-type=password
keycloak.admin.username=feres
keycloak.admin.password=feres
# Ou : grant-type=client_credentials + client confidentiel (service account) avec droits manage-users
# keycloak.admin.grant-type=client_credentials