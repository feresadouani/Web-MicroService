spring.application.name=gateway
server.port=8081
spring.main.web-application-type=reactive

# JWT Keycloak (ReactiveJwtDecoder auto-config)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/spring

# Routes
spring.cloud.gateway.routes[0].id=clubs-service
spring.cloud.gateway.routes[0].uri=lb://CLUBS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/clubs/**

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CORS (front http://localhost:4200)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
