spring.application.name=gateway
server.port=8081
spring.main.web-application-type=reactive

# JWT Keycloak (ReactiveJwtDecoder auto-config)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/spring

# Routes (order plus bas = priorité plus haute : /users/** puis /reclamations/** puis le reste)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[0].order=0
spring.cloud.gateway.routes[1].id=reclamation-service
spring.cloud.gateway.routes[1].uri=lb://RECLAMATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/reclamations/**
spring.cloud.gateway.routes[1].order=5

spring.cloud.gateway.routes[2].id=event-service-api
spring.cloud.gateway.routes[2].uri=lb://EVENTS
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/events,/api/events/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/events/(?<segment>.*), /events/$\{segment}
spring.cloud.gateway.routes[2].filters[1]=RewritePath=/api/events, /events

spring.cloud.gateway.routes[3].id=event-service-direct
spring.cloud.gateway.routes[3].uri=lb://EVENTS
spring.cloud.gateway.routes[3].predicates[0]=Path=/events/**

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CORS (front http://localhost:4200)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
