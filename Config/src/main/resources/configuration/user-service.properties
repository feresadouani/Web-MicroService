spring.application.name=user-service
server.port=8083

# JWT Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/spring

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/univer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Data REST
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


keycloak.admin.enabled=true
keycloak.admin.server-url=http://localhost:9090
# Jeton : realm du endpoint (souvent master)
keycloak.admin.admin-realm=master
# grant-type=password : compte admin Keycloak (realm master). Si invalid_grant : mettez le vrai mot de passe (ou client_credentials ci-dessous).
keycloak.admin.grant-type=password
keycloak.admin.username=admin
keycloak.admin.password=admin
# Ou : grant-type=client_credentials + client confidentiel (service account) avec droits manage-users
# keycloak.admin.grant-type=client_credentials
# keycloak.admin.token-client-id=user-service
# keycloak.admin.token-client-secret=secret
# keycloak.admin.token-realm=master
keycloak.admin.target-realm=spring
keycloak.admin.frontend-client-id=myapp