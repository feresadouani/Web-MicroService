spring.application.name=cours
spring.config.import=optional:configserver:http://localhost:8082

# Local fallback DB config (used when config server is unavailable)
spring.datasource.url=jdbc:h2:file:./data/coursdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
