version: "3.9"

services:
  eureka:
    build: ./eureka
    image: eureka:1.0
    container_name: eureka-container
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=Eureka
      - SERVER_PORT=8761
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - micro-net

  config-server:
    build: ./Config
    image: config-server:1.0
    container_name: config-server-container
    ports:
      - "8082:8082"
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=config-server
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=classpath:/configuration
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - micro-net

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=univer
      - MYSQL_ALLOW_EMPTY_PASSWORD=no
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - micro-net

  keycloak:
    image: keycloak/keycloak:26.5.1
    container_name: keycloak
    command: start-dev --http-port=8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=keycloak
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./data/h2:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - micro-net

  mongodb:
    image: mongo:7
    container_name: reclamation-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - micro-net

  reclamation-service:
    build: ./reclamation
    image: reclamation-service:1.0
    container_name: reclamation-service-container
    ports:
      - "3000:3000"
    depends_on:
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/reclamation
      - MONGO_DB=reclamation
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/spring
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/spring/protocol/openid-connect/certs
      - EUREKA_HOST=eureka
      - EUREKA_PORT=8761
      - EUREKA_SERVICE_PATH=/eureka/apps/
      - INSTANCE_HOSTNAME=reclamation-service
      - INSTANCE_IP=127.0.0.1
    networks:
      - micro-net

  user-service:
    build: ./user
    image: user-service:1.0
    container_name: user-service-container
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=user-service
      - SERVER_PORT=8083
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/univer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/spring
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/spring/protocol/openid-connect/certs
      - KEYCLOAK_ADMIN_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_ADMIN_REALM=master
      - KEYCLOAK_ADMIN_GRANT_TYPE=password
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN_TARGET_REALM=spring
      - KEYCLOAK_ADMIN_FRONTEND_CLIENT_ID=myapp
    networks:
      - micro-net

  events-service:
    build: ./events
    image: events-service:1.0
    container_name: events-service-container
    ports:
      - "8084:8084"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=events
      - SERVER_PORT=8084
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/univer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useInformationSchema=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - micro-net

  cours-service:
    build: ./cours
    image: cours-service:1.0
    container_name: cours-service-container
    ports:
      - "8085:8085"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=cours
      - SERVER_PORT=8085
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/spring
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/spring/protocol/openid-connect/certs
      - SPRING_DATASOURCE_URL=jdbc:h2:file:./data/coursdb;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
    volumes:
      - cours-data:/app/data
    networks:
      - micro-net

  reservation-service:
    build: ./Reservation
    image: reservation-service:1.0
    container_name: reservation-service-container
    ports:
      - "8086:8086"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=reservation-service
      - SERVER_PORT=8086
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/univer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/spring
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/spring/protocol/openid-connect/certs
    networks:
      - micro-net

  clubs-service:
    build: ./clubs
    image: clubs-service:1.0
    container_name: clubs-service-container
    ports:
      - "8088:8088"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=clubs-service
      - SERVER_PORT=8088
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/spring
      - KEYCLOAK_ADMIN_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_ADMIN_REALM=master
      - KEYCLOAK_ADMIN_GRANT_TYPE=password
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN_TARGET_REALM=spring
      - KEYCLOAK_ADMIN_FRONTEND_CLIENT_ID=myapp
    networks:
      - micro-net

  gateway:
    build: ./gateway
    image: gateway:1.0
    container_name: gateway-container
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
      clubs-service:
        condition: service_started
      events-service:
        condition: service_started
      reservation-service:
        condition: service_started
      reclamation-service:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=gateway
      - SERVER_PORT=8081
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/spring
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/spring/protocol/openid-connect/certs
    networks:
      - micro-net

  frontend:
    build: ./frontend
    image: frontend:1.0
    container_name: frontend-container
    ports:
      - "4200:80"
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge

volumes:
  mysql-data:
  cours-data:
  mongo-data:
